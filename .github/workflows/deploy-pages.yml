name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/deploy-pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Trunk.toml"
      - "assets/**"
      - "crates/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions: {}

env:
  TRUNK_VERSION: 0.21.14

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned Trunk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}

      - name: Install pinned Trunk
        run: |
          if [[ "$(trunk --version 2>/dev/null || true)" != "trunk ${TRUNK_VERSION}" ]]; then
            cargo install --locked --force trunk --version "${TRUNK_VERSION}"
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          NO_COLOR: "true"
        run: trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
