name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned Trunk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ runner.arch }}-0.21.14

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Install pinned Trunk
        run: |
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install --locked trunk --version 0.21.14
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          TRUNK_BUILD_LOCKED: "true"
          TRUNK_BUILD_PUBLIC_URL: ${{ steps.pages.outputs.base_path }}/
        run: corepack pnpm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
