name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --check

      - name: Check native workspace
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked

      - name: Test native workspace
        run: |
          cargo +"$RUST_TOOLCHAIN" install --locked cargo-nextest --version 0.9.140
          cargo nextest run --profile ci --workspace --all-features --locked --no-tests pass

      - name: Lint workspace
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check WASM workspace
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --target wasm32-unknown-unknown --all-features --locked

      - name: Install pinned Trunk
        run: cargo +"$RUST_TOOLCHAIN" install --locked trunk --version 0.21.14

      - name: Build release web application
        run: trunk build --release --locked

  dependency-policy:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Install pinned dependency tools
        run: cargo +"$RUST_TOOLCHAIN" install --locked cargo-audit --version 0.22.2

      - name: Review dependency licenses and changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          allow-licenses: Apache-2.0, BSL-1.0, CC0-1.0, MIT, Unicode-3.0, Unlicense, Zlib

      - name: Check RustSec advisories
        run: cargo audit --deny warnings
