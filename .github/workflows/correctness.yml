name: Correctness

on:
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/correctness.yml"
      - ".nvmrc"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Trunk.toml"
      - "assets/**"
      - "crates/**"
      - "e2e/**"
      - "package.json"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "ruff.toml"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
      - "ty.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_CLI_VERSION: 0.2.126
  ZXING_COMMIT: 8dd1cf5c4fd6fb6211bb96713db926ac6f2cf825
  QUIRC_COMMIT: 542848dd6b9b0eaa9587bbf25b9bc67bd8a71fca

jobs:
  routine:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tests/oracles/uv.lock
      - name: Cache Rust inputs and outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Cache pinned tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: tools-${{ runner.os }}-${{ runner.arch }}-trunk-${{ env.TRUNK_VERSION }}-wasm-bindgen-${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Cache verified decoder build inputs
        uses: actions/cache@v5
        with:
          path: |
            tests/oracles/zxing-cpp
            tests/oracles/quirc
          key: decoders-${{ runner.os }}-${{ runner.arch }}-zxing-${{ env.ZXING_COMMIT }}-quirc-${{ env.QUIRC_COMMIT }}-${{ hashFiles('tests/fixtures/manifest.json', 'tests/oracles/quirc-reader.c', 'tests/oracles/uv.lock') }}
      - name: Install dependencies and verify pinned decoder builds
        run: |
          ./scripts/setup.sh
          pnpm exec playwright install --with-deps chromium
      - name: Run routine correctness gate
        run: pnpm run verify

  extended-decoders:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v7
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Cache verified decoder build inputs
        uses: actions/cache@v5
        with:
          path: |
            tests/oracles/zxing-cpp
            tests/oracles/quirc
          key: decoders-${{ runner.os }}-${{ runner.arch }}-zxing-${{ env.ZXING_COMMIT }}-quirc-${{ env.QUIRC_COMMIT }}-${{ hashFiles('tests/fixtures/manifest.json', 'tests/oracles/quirc-reader.c', 'tests/oracles/uv.lock') }}
      - name: Install dependencies and verify pinned decoder builds
        run: ./scripts/setup.sh
      - name: Run extended decoder campaigns without retries
        run: |
          mkdir -p target/decoder-logs
          set -o pipefail
          cargo test -p qr-core --test independent_decode -- --ignored --nocapture 2>&1 | tee target/decoder-logs/core.log
          pnpm run release:evidence 2>&1 | tee target/decoder-logs/artifacts.log
          pnpm run test:quirc 2>&1 | tee target/decoder-logs/quirc.log
      - name: Upload decoder failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: decoder-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            target/decoder-logs
            target/release-evidence
            test-results
            playwright-report
