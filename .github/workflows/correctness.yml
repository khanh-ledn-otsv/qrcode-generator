name: Correctness

on:
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/**"
      - ".nvmrc"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Trunk.toml"
      - "assets/**"
      - "crates/**"
      - "e2e/**"
      - "package.json"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "ruff.toml"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
      - "ty.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_VERSION: v0.17.0
  TAILWIND_VERSION: 4.3.3
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_CLI_VERSION: 0.2.126
  ZXING_COMMIT: 8dd1cf5c4fd6fb6211bb96713db926ac6f2cf825

jobs:
  routine:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      deploy_pages: ${{ steps.verification.outputs.deploy_pages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Determine verification scope
        id: verification
        env:
          CI_VERIFY_BASE_SHA: ${{ github.event.before }}
        run: |
          changed_paths=()
          if [[ -z "${CI_VERIFY_BASE_SHA}" || "${CI_VERIFY_BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${CI_VERIFY_BASE_SHA}^{commit}" 2>/dev/null; then
            changed_paths+=("__unavailable_ci_base__")
          else
            mapfile -t changed_paths < <(git diff --name-only "${CI_VERIFY_BASE_SHA}" HEAD)
          fi
          verification_scope="$(scripts/select-verification.sh "${changed_paths[@]}")"
          deploy_pages="$(scripts/select-pages-deployment.sh "${changed_paths[@]}")"
          echo "scope=${verification_scope}" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=${deploy_pages}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Resolve pnpm store
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@1.97.1
        if: steps.verification.outputs.scope == 'core' || steps.verification.outputs.scope == 'render' || steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Configure pinned shared sccache
        if: steps.verification.outputs.scope == 'core' || steps.verification.outputs.scope == 'render' || steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.verification.outputs.scope == 'python' || steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            tests/oracles/pyproject.toml
            tests/oracles/uv.lock
      - name: Cache Rust dependencies
        if: steps.verification.outputs.scope == 'core' || steps.verification.outputs.scope == 'render' || steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          cache-bin: false
          shared-key: linux-rust-1.97.1
      - name: Cache pinned Trunk and Tailwind
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full' || steps.verification.outputs.deploy_pages == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cache/trunk
          key: trunk-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-tailwind-${{ env.TAILWIND_VERSION }}
      - name: Cache pinned wasm-bindgen tools
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Cache verified decoder build inputs
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        uses: actions/cache@v6
        with:
          path: |
            tests/oracles/zxing-cpp
          key: zxing-${{ runner.os }}-${{ runner.arch }}-${{ env.ZXING_COMMIT }}-${{ hashFiles('scripts/setup-decoders.sh', 'tests/oracles/pyproject.toml', 'tests/oracles/uv.lock') }}
          restore-keys: zxing-${{ runner.os }}-${{ runner.arch }}-${{ env.ZXING_COMMIT }}-
      - name: Install dependencies and verify pinned decoder builds
        if: steps.verification.outputs.scope == 'web' || steps.verification.outputs.scope == 'full'
        env:
          QR_DECODER_SETUP_MODE: zxing
          QR_PLAYWRIGHT_INSTALL_MODE: with-deps
        run: ./scripts/setup.sh
      - name: Install pinned Trunk for focused Pages build
        if: steps.verification.outputs.deploy_pages == 'true' && steps.verification.outputs.scope != 'web' && steps.verification.outputs.scope != 'full'
        run: |
          if [[ "$(trunk --version 2>/dev/null || true)" != "trunk ${TRUNK_VERSION}" ]]; then
            cargo install --locked --force trunk --version "${TRUNK_VERSION}"
          fi
      - name: Run routine correctness gate
        env:
          CI_VERIFY_BASE_SHA: ${{ github.event.before }}
        run: pnpm run verify:changed
      - name: Configure GitHub Pages
        if: steps.verification.outputs.deploy_pages == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - name: Repackage verified build for GitHub Pages
        if: steps.verification.outputs.deploy_pages == 'true'
        env:
          NO_COLOR: "true"
        run: trunk build --release --locked --dist dist-pages --public-url "${{ steps.pages.outputs.base_path }}/"
      - name: Upload verified GitHub Pages artifact
        if: steps.verification.outputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy-pages:
    needs: routine
    if: needs.routine.outputs.deploy_pages == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
