name: Extended decoders

on:
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/extended-decoders.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "assets/**"
      - "crates/qr-core/**"
      - "crates/qr-render/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "scripts/release-evidence.sh"
      - "scripts/setup-decoders.sh"
      - "scripts/setup.sh"
      - "tests/adverse/**"
      - "tests/approved-output-matrix-policy.json"
      - "tests/baselines/**"
      - "tests/fixtures/**"
      - "tests/oracles/**"
      - "tests/support/collect_approved_output_evidence.py"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_CLI_VERSION: 0.2.126
  ZXING_COMMIT: 8dd1cf5c4fd6fb6211bb96713db926ac6f2cf825
  QUIRC_COMMIT: 542848dd6b9b0eaa9587bbf25b9bc67bd8a71fca

jobs:
  extended-decoders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            tests/oracles/pyproject.toml
            tests/oracles/uv.lock
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: tools-${{ runner.os }}-${{ runner.arch }}-trunk-${{ env.TRUNK_VERSION }}-wasm-bindgen-${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Cache verified decoder build inputs
        uses: actions/cache@v6
        with:
          path: |
            tests/oracles/zxing-cpp
            tests/oracles/quirc
          key: decoders-${{ runner.os }}-${{ runner.arch }}-zxing-${{ env.ZXING_COMMIT }}-quirc-${{ env.QUIRC_COMMIT }}-${{ hashFiles('scripts/setup-decoders.sh', 'tests/oracles/quirc-reader.c', 'tests/oracles/pyproject.toml', 'tests/oracles/uv.lock') }}
          restore-keys: decoders-${{ runner.os }}-${{ runner.arch }}-zxing-${{ env.ZXING_COMMIT }}-quirc-${{ env.QUIRC_COMMIT }}-
      - name: Install dependencies and verify pinned decoder builds
        env:
          QR_PLAYWRIGHT_INSTALL_MODE: skip
        run: ./scripts/setup.sh
      - name: Run extended decoder campaigns without retries
        run: |
          mkdir -p target/decoder-logs
          set -o pipefail
          cargo test -p qr-core --test independent_decode -- --ignored --nocapture 2>&1 | tee target/decoder-logs/core.log
          pnpm run release:evidence 2>&1 | tee target/decoder-logs/artifacts.log
          pnpm run test:quirc 2>&1 | tee target/decoder-logs/quirc.log
      - name: Upload decoder failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: decoder-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            target/decoder-logs
            target/release-evidence
            test-results
            playwright-report
