[package]
name = "qr-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fixture-tool = { path = "../tools/fixture-tool" }
png = { version = "=0.18.1", default-features = false }
qr-core = { path = "../crates/qr-core" }
qr-render = { path = "../crates/qr-render" }

[[bin]]
name = "encode_utf8"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_valid_text"
path = "fuzz_targets/encode_valid_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bit_buffer"
path = "fuzz_targets/bit_buffer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reed_solomon"
path = "fuzz_targets/reed_solomon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matrix_build"
path = "fuzz_targets/matrix_build.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_png"
path = "fuzz_targets/render_png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_svg"
path = "fuzz_targets/render_svg.rs"
test = false
