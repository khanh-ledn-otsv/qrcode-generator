[workspace]
members = [
    "crates/qr-core",
    "crates/qr-render",
    "crates/qr-web",
    "tools/fixture-tool",
]
exclude = ["fuzz"]
default-members = [
    "crates/qr-core",
    "crates/qr-render",
    "crates/qr-web",
    "tools/fixture-tool",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
leptos = { version = "=0.8.20", features = ["csr"] }
qr-core = { version = "=0.1.0", path = "crates/qr-core" }
qr-render = { version = "=0.1.0", path = "crates/qr-render" }
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
