<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generate QR codes locally in your browser"
    />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="qr-web"
      data-wasm-opt="z"
    />
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="qr-preview-worker"
      data-type="worker"
      data-loader-shim
      data-wasm-opt="z"
    />
    <link data-trunk rel="tailwind-css" href="input.css" />
    <link data-trunk rel="copy-dir" href="public" />
    <title>QR Code Generator</title>
  </head>
  <body></body>
</html>
