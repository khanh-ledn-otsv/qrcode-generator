<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generate QR codes locally in your browser"
    />
    <meta name="theme-color" content="#f8fafc" />
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="qr-web"
      data-wasm-opt="z"
    />
    <link data-trunk rel="tailwind-css" href="input.css" />
    <title>QR Code Generator</title>
  </head>
  <body>
    <aside
      data-tailwind-check
      class="fixed bottom-4 right-4 z-50 w-[calc(100%-2rem)] max-w-xs rounded-2xl border border-slate-200 bg-white/90 p-4 shadow-2xl shadow-slate-300/50 backdrop-blur-md sm:bottom-6 sm:right-6"
    >
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="text-brand text-xs font-bold uppercase tracking-widest">
            Tailwind check
          </p>
          <p class="mt-1 text-sm text-slate-600">Utilities are working.</p>
        </div>
        <span
          class="rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-600/20"
        >
          Active
        </span>
      </div>

      <div class="mt-4 grid grid-cols-3 gap-2" aria-label="Theme colors">
        <div class="bg-brand h-2 rounded-full" title="Brand"></div>
        <div class="bg-brand-light h-2 rounded-full" title="Brand light"></div>
        <div class="bg-brand-dark h-2 rounded-full" title="Brand dark"></div>
      </div>
    </aside>
  </body>
</html>
